DOCUMENTATION:
  module: management_pack_info
  version_added: "2.0.0"
  short_description: Retrieve information about installed SCOM management packs.
  description:
    - Returns a list of installed SCOM management packs, optionally filtered by
      name, display name, or ID.
    - This is an info module - it never makes changes and always returns C(changed=false).
  author:
    - Shahar Golshani (@shahargolshani)
    - Ansible Ecosystem Engineering team (@eco-ansible-content)
  extends_documentation_fragment:
    - microsoft.scom.uses_scom_ps_module
  options:
    name:
      description:
        - Filter by the identity name of the management pack. Supports wildcards.
        - Mutually exclusive with O(id).
      type: str
      required: false
    display_name:
      description:
        - Filter by the display name of the management pack. Supports wildcards.
        - Mutually exclusive with O(id).
      type: str
      required: false
    id:
      description:
        - Filter by the GUID of the management pack.
        - Mutually exclusive with O(name) and O(display_name).
      type: str
      required: false

EXAMPLES: |
  - name: Get all installed management packs
    microsoft.scom.management_pack_info:
    register: all_mps

  - name: Get management packs matching a name pattern
    microsoft.scom.management_pack_info:
      name: "Microsoft.SQLServer.*"
    register: sql_mps

  - name: Get a management pack by ID
    microsoft.scom.management_pack_info:
      id: "36b62dc1-e525-e356-4e26-9d12e31ccd62"

RETURN:
  management_packs:
    description: List of installed SCOM management packs matching the filter.
    returned: always
    type: list
    elements: dict
    contains:
      id:
        description: GUID of the management pack.
        type: str
      name:
        description: Identity name of the management pack.
        type: str
      display_name:
        description: Display name of the management pack.
        type: str
      version:
        description: Version of the management pack.
        type: str
      sealed:
        description: Whether the management pack is sealed.
        type: bool
      time_created:
        description: Timestamp the management pack was created (yyyy-MM-dd HH:mm:ss z).
        type: str
      last_modified:
        description: Timestamp of the last modification (yyyy-MM-dd HH:mm:ss z).
        type: str
